<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3b3c Bot Farm</title>
  <style>
    /* Minimal styling, adapted from your code */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      padding: 20px;
    }
    header {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 20px; text-align: center;
    }
    header img {
      height: 60px; margin-bottom: 10px;
    }
    header h1 { font-size: 2.5em; font-weight: 700; }

    #global-controls {
      margin-bottom: 20px; text-align: center;
    }
    #global-controls button {
      margin: 0 10px 10px; padding: 10px 15px;
      background-color: #333; color: #e0e0e0;
      border: none; border-radius: 4px;
      cursor: pointer; font-size: 1em;
      transition: background-color 0.3s ease;
    }
    #global-controls button:hover {
      background-color: #555;
    }
    #global-controls button.shutdown {
      background-color: #d32f2f;
    }
    #global-controls button.shutdown:hover {
      background-color: #b71c1c;
    }

    #market-search {
      text-align: center; margin-bottom: 20px;
      position: relative; width: 40%;
      margin-left: auto; margin-right: auto;
    }
    #market-search input {
      width: 100%; padding: 10px; font-size: 1em;
      border: 1px solid #444; border-radius: 4px;
    }
    #suggestions {
      position: absolute; top: 42px; width: 100%;
      background-color: #333; border: 1px solid #444;
      border-radius: 4px; z-index: 100;
      max-height: 200px; overflow-y: auto;
    }
    .suggestion {
      padding: 8px; cursor: pointer; text-align: left;
    }
    .suggestion:hover { background-color: #555; }

    #selected-markets {
      margin-top: 10px; text-align: center;
    }
    .chip {
      display: inline-block; background-color: #444;
      padding: 6px 10px; border-radius: 16px;
      margin: 4px; font-size: 0.9em; cursor: default;
    }

    #clear-inactive {
      margin-top: 10px; padding: 10px 15px;
      background-color: #555; color: #e0e0e0;
      border: none; border-radius: 4px;
      cursor: pointer; font-size: 1em;
      transition: background-color 0.3s ease;
    }
    #clear-inactive:disabled {
      background-color: #333; cursor: not-allowed;
    }

    #task-list {
      background-color: #1e1e1e; padding: 10px; margin-bottom: 20px;
      border: 1px solid #444; border-radius: 4px;
      text-align: center; font-size: 1.1em; width: 260px;
      margin-left: auto; margin-right: auto;
    }

    #bots {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }
    .bot {
      background-color: #1e1e1e; border: 1px solid #444;
      border-radius: 4px; padding: 15px;
      display: flex; flex-direction: column;
      justify-content: space-between; min-height: 420px;
    }
    .bot h2 {
      font-size: 1.5em; margin-bottom: 10px; text-align: center;
    }
    .bot p {
      font-size: 1em; margin-bottom: 10px; text-align: center;
    }
    .bot .status {
      text-align: center; margin-bottom: 10px; font-size: 1em;
    }
    .bot .buttons {
      text-align: center; margin-bottom: 10px;
    }
    .bot button:hover {
      background-color: #555;
    }
    .bot h3 {
      margin-bottom: 5px; text-align: center; font-size: 1.1em;
    }
    .log {
      background-color: #000; font-family: Consolas, 'Courier New', monospace;
      font-size: 0.85em; height: 250px; overflow-y: auto;
      padding: 10px; border: 1px solid #444; border-radius: 4px;
      white-space: pre-wrap; word-wrap: break-word; min-width: 0;
    }
    #bots-header {
      background-color: #222; border: 1px solid #444;
      border-radius: 4px; padding: 10px; margin-bottom: 10px;
      text-align: center; width: 100%;
    }
    #bots-header h2 {
      font-size: 1.8em; color: #fff; margin: 0;
    }

    .start-button {
      background-color: #1c501f; /* green-ish */
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 8px 12px;
      font-size: 0.85em;
    }
    .start-button:hover {
      background-color: #1c501f;
    }

    .stop-button {
      background-color: #500f0f; /* red-ish */
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 8px 12px;
      font-size: 0.85em;
    }

    .other-button {
      background-color: #363636;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 8px 12px;
      font-size: 0.85em;
    }

    .button-row {
      gap: 1cm;
      margin-bottom: 1px; 
    }

    .stop-button:hover {
      background-color: #363636;
    }

    @media (max-width: 768px) {
      #bots { grid-template-columns: 1fr; }
      #market-search { width: 90%; }
      header h1 { font-size: 2em; }
      #task-list { width: 70%; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/ansi_up@5.0.0/ansi_up.min.js"></script>
</head>
<body>

  <header>
    <img src="https://images.crunchbase.com/image/upload/c_pad,f_auto,q_auto:eco,dpr_1/radxv99bd8jwiuqwxt95" alt="PolyMarket Logo">
    <h1>3b3c Bot Farm</h1>
  </header>

  <!-- Balance and usage -->
  <div id="balance-container" style="text-align: center; margin-bottom: 20px;">
    <span style="font-size: 1.2em;">Balance (USDC.E): </span>
    <span id="balance-display" style="font-size: 1.2em; font-weight: bold;">Loading...</span>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; margin: 20px 0;">
    <label for="api-usage-progress" style="font-weight: 500; color: #ccc; margin-bottom: 8px; font-size: 1rem;">
      API Usage (per 10 sec)
    </label>
    <div id="api-usage-container" style="
          width: 300px;
          background-color: #2b2b2b;
          border: 1px solid #444;
          border-radius: 8px;
          overflow: hidden;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        ">
      <div id="api-usage-progress" style="
            background-color: #4caf50;
            width: 0%;
            height: 24px;
            transition: width 0.5s ease;
          "></div>
    </div>
    <div id="api-usage-text" style="margin-top: 8px; font-size: 0.9rem; color: #aaa;">
      Usage: 0 calls / 80 calls
    </div>
  </div>

  <!-- Global controls -->
  <div id="global-controls">
    <button class="start-button" onclick="startAll()">Start All</button>
    <button class="stop-button" onclick="stopAll()">Stop All</button>
  </div>

  <!-- Market search and selections -->
  <div id="market-search">
    <input type="text" id="search-input" placeholder="Enter market title..." autocomplete="off" oninput="searchMarkets()" />
    <div id="suggestions"></div>
    <div id="selected-markets"></div>
    <button id="clear-inactive" onclick="clearInactiveSelections()">Clear Inactive Selections</button>
  </div>

  <!-- Task list -->
  <div id="task-list">
    <b>Active Bots:</b>
    <div id="tasks-output">None</div>
  </div>

  <!-- Bots header -->
  <div id="bots-header">
    <h2>Deployed Bot Tabs</h2>
  </div>

  <!-- Bots container -->
  <div id="bots">No markets selected.</div>

  <script>
    /* ============================
       Global Variables & Helpers
       ============================ */
    const ansi_up = new AnsiUp();
    ansi_up.use_classes = false;
    ansi_up.escape_for_html = false;

    let marketList = [];           // from /markets
    const selectedMarkets = [];    // user-chosen markets
    const wsConnections = {};      // store WebSocket objects
    let activeTasks = [];          // strings like ["(slug, 0)", "(slug, 1)"]
    let previousActiveTasks = [];

    // Save/Load selected markets to localStorage
    function saveSelectedMarkets() {
      localStorage.setItem("selectedMarkets", JSON.stringify(selectedMarkets));
    }
    function loadSelectedMarkets() {
      const saved = localStorage.getItem("selectedMarkets");
      if (saved) {
        try {
          const arr = JSON.parse(saved);
          if (Array.isArray(arr)) {
            arr.forEach(item => {
              if (item.market_slug && item.question
                  && !selectedMarkets.find(m => m.market_slug === item.market_slug)) {
                selectedMarkets.push(item);
              }
            });
          }
        } catch (e) {
          console.error("Error parsing saved selected markets:", e);
        }
      }
    }

    /* ============================
       Search Markets / Suggestions
       ============================ */
    async function searchMarkets() {
      const query = document.getElementById("search-input").value;
      const suggestionsDiv = document.getElementById("suggestions");
      if (!query) {
        suggestionsDiv.innerHTML = "";
        return;
      }
      try {
        const response = await fetch(`http://localhost:8000/suggest_markets?query=${encodeURIComponent(query)}`);
        const data = await response.json();
        const suggestions = data.suggestions;
        suggestionsDiv.innerHTML = "";
        suggestions.forEach(suggestion => {
          const div = document.createElement("div");
          div.className = "suggestion";
          div.textContent = suggestion.question;
          div.onclick = () => {
            if (!selectedMarkets.find(m => m.market_slug === suggestion.market_slug)) {
              selectedMarkets.push(suggestion);
              updateBotGrid();
              saveSelectedMarkets();
            }
            document.getElementById("search-input").value = "";
            suggestionsDiv.innerHTML = "";
          };
          suggestionsDiv.appendChild(div);
        });
      } catch (error) {
        console.error("Error searching markets:", error);
      }
    }

    /* ============================
       Update Selected Chips
       ============================ */
    function updateSelectedDisplay() {
      const selectedDiv = document.getElementById("selected-markets");
      selectedDiv.innerHTML = "";
      selectedMarkets.forEach(market => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = market.question;
        selectedDiv.appendChild(chip);
      });
      updateClearInactiveButton();
    }

    function updateClearInactiveButton() {
      const clearBtn = document.getElementById("clear-inactive");
      // If no active tasks mention this slug, it's "inactive."
      const inactive = selectedMarkets.filter(m =>
        !activeTasks.some(t => t.includes(`(${m.market_slug},`))
      );
      clearBtn.disabled = (inactive.length === 0);
    }

    /* ============================
       Build the 'bots' grid
       ============================ */
    function updateBotGrid() {
      const botsContainer = document.getElementById("bots");
      botsContainer.innerHTML = "";
      if (selectedMarkets.length === 0) {
        botsContainer.textContent = "No markets selected.";
        return;
      }
      selectedMarkets.forEach((market, index) => {
        const botSlug = market.market_slug;
        const question = market.question;
        const displayIndex = index + 1;
        const minShares = market?.rewards?.min_size || 1;
        const currentShares = market?.rewards?.current_size || 0;

        // We'll label side 0 and side 1 by their "outcome":
        let side0Outcome = "Side0";
        let side1Outcome = "Side1";
        if (market.tokens && market.tokens.length >= 2) {
          side0Outcome = market.tokens[0].outcome || "Side0";
          side1Outcome = market.tokens[1].outcome || "Side1";
        }

        const container = document.createElement("div");
        container.className = "bot";
        container.id = `bot-${botSlug}`;

        container.innerHTML = `
          <div style="position: relative;">
            <span class="remove-bot" style="position: absolute; top: 5px; right: 5px; cursor: pointer; font-size: 1.2em; color: #e0e0e0;"
              onclick="removeBot('${botSlug}')">&times;</span>
            <h2>Bot #${displayIndex}</h2>
          </div>
          <p>${question}</p>
          <p>Min Order Quantity: <strong>${minShares}</strong></p>
          <p>Current Order Quantity: <strong id="current-qty-${botSlug}">Loading...</strong></p>
          <div class="status">Status: <span id="status-${botSlug}">Not Running</span></div>
          <div class="buttons">
            <!-- Global Controls -->
            <div class="button-row">
              <button class="start-button" id="start-${botSlug}" onclick="startBot('${botSlug}')">Start</button>
              <button class="stop-button" id="stop-${botSlug}" onclick="stopBot('${botSlug}')">Stop</button>
            </div>
            <br/>
            <!-- Side-specific Buttons with Outcome Labels -->
            <div class="button-row">
              <button class="start-button" id="start-side-0-${botSlug}" onclick="startSide('${botSlug}', 0)">Start ${side0Outcome}</button>
              <button class="start-button" id="start-side-1-${botSlug}" onclick="startSide('${botSlug}', 1)">Start ${side1Outcome}</button>
              <button class="stop-button" id="stop-side-0-${botSlug}" onclick="stopSide('${botSlug}', 0)">Stop ${side0Outcome}</button>
              <button class="stop-button" id="stop-side-1-${botSlug}" onclick="stopSide('${botSlug}', 1)">Stop ${side1Outcome}</button>
            </div>
            <br/>
            <div class="button-row">
              <button class="other-button" onclick="updateOrderQuantity('${botSlug}')">Update Order Qty</button>
              <button class="other-button" onclick="clearLogs('${botSlug}')">Clear Logs</button>
              <button class="other-button" onclick="exportLogs('${botSlug}')">Export Logs</button>
            </div>
          </div>
          <h3>Logs:</h3>
          <pre class="log" id="log-${botSlug}">Waiting for logs...</pre>
        `;
        botsContainer.appendChild(container);

        // Connect logs WebSocket for this market
        connectWebSocket(botSlug);
      });
      updateSelectedDisplay();
    }

    function removeBot(marketSlug) {
      const index = selectedMarkets.findIndex(m => m.market_slug === marketSlug);
      if (index !== -1) {
        selectedMarkets.splice(index, 1);
        updateBotGrid();
        saveSelectedMarkets();
      }
    }

    function clearInactiveSelections() {
      const beforeCount = selectedMarkets.length;
      for (let i = selectedMarkets.length - 1; i >= 0; i--) {
        const slug = selectedMarkets[i].market_slug;
        // if no tasks mention (slug, x)
        if (!activeTasks.some(t => t.includes(`(${slug},`))) {
          selectedMarkets.splice(i, 1);
        }
      }
      if (selectedMarkets.length < beforeCount) {
        alert("Inactive selections cleared.");
      }
      updateBotGrid();
      saveSelectedMarkets();
    }

    /* ============================
       Start/Stop Entire Market
       ============================ */
    async function startBot(botSlug) {
      try {
        const response = await fetch(`http://localhost:8000/start_bot/${botSlug}`, { method: "POST" });
        const data = await response.json();
        alert(data.status || data.detail);
      } catch (error) {
        alert("Error: " + error);
      }
    }
    async function stopBot(botSlug) {
      try {
        const response = await fetch(`http://localhost:8000/stop_bot/${botSlug}`, { method: "POST" });
        const data = await response.json();
        alert(data.status || data.detail);
      } catch (error) {
        alert("Error: " + error);
      }
    }

    /* ============================
       Start/Stop Single Side
       ============================ */
    async function startSide(botSlug, tokenIndex) {
      try {
        const url = `http://localhost:8000/start_side/${botSlug}/${tokenIndex}`;
        const response = await fetch(url, { method: "POST" });
        const data = await response.json();
        alert(data.status || data.detail);
      } catch (error) {
        alert("Error: " + error);
      }
    }
    async function stopSide(botSlug, tokenIndex) {
      try {
        const response = await fetch(`http://localhost:8000/stop_side/${botSlug}/${tokenIndex}`, { method: "POST" });
        const data = await response.json();
        alert(data.status || data.detail);
      } catch (error) {
        alert("Error: " + error);
      }
    }

    /* ============================
       Start/Stop All (Both Sides)
       ============================ */
    function startAll() {
      const confirmed = selectedMarkets.map(m => m.market_slug);
      fetch("http://localhost:8000/start_all", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(confirmed)
      })
      .then(response => response.json())
      .then(data => alert(data.status || data.detail))
      .catch(error => alert("Error: " + error));
    }
    function stopAll() {
      const confirmed = selectedMarkets.map(m => m.market_slug);
      fetch("http://localhost:8000/stop_all", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(confirmed)
      })
      .then(response => response.json())
      .then(data => alert(data.status || data.detail))
      .catch(error => alert("Error: " + error));
    }

    /* ============================
       WebSocket for Logs
       ============================ */
    function connectWebSocket(botSlug) {
      if (wsConnections[botSlug]) {
        return; // Already have a connection
      }
      const ws = new WebSocket(`ws://localhost:8000/ws/logs/${botSlug}`);
      ws.onmessage = (event) => {
        const html = ansi_up.ansi_to_html(event.data);
        const logElement = document.getElementById(`log-${botSlug}`);
        if (logElement) {
          logElement.innerHTML = html;
          // If "filled" + "shutting down bot" => color red background
          if (html.toLowerCase().includes("filled") && html.toLowerCase().includes("shutting down bot")) {
            const botContainer = document.getElementById(`bot-${botSlug}`);
            if (botContainer) {
              botContainer.style.backgroundColor = "#330000";
            }
          }
        }
      };
      ws.onclose = (ev) => {
        console.log(`WebSocket for ${botSlug} closed, code=${ev.code}`);
      };
      wsConnections[botSlug] = ws;
    }

    /* ============================
       Clear/Export Logs
       ============================ */
    async function clearLogs(botSlug) {
      try {
        const response = await fetch(`http://localhost:8000/clear_logs/${botSlug}`, { method: "POST" });
        const data = await response.json();
        const logElem = document.getElementById(`log-${botSlug}`);
        if (logElem) {
          logElem.innerHTML = "Logs cleared.";
        }
        alert(data.status || data.detail);
      } catch (error) {
        alert("Error clearing logs: " + error);
      }
    }
    function exportLogs(botSlug) {
      const logElem = document.getElementById(`log-${botSlug}`);
      if (logElem) {
        const logs = logElem.textContent;
        const now = new Date();
        const options = { 
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit',
          hour12: false, timeZone: 'Europe/Bucharest'
        };
        const romaniaTime = new Intl.DateTimeFormat('sv-SE', options)
          .format(now)
          .replace(" ", "_")
          .replace(/:/g, "-");
        const filename = `logs_${botSlug}_${romaniaTime}.txt`;
        const blob = new Blob([logs], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename; a.click();
        window.URL.revokeObjectURL(url);
      }
    }

    /* ============================
       Update Order Quantity
       ============================ */
    async function updateOrderQuantity(botSlug) {
      let newQuantity = prompt("Enter new order quantity (>= min order size):");
      if (!newQuantity) return;
      newQuantity = parseFloat(newQuantity);
      if (isNaN(newQuantity)) {
        alert("Invalid quantity.");
        return;
      }
      try {
        const response = await fetch(`http://localhost:8000/update_order_quantity/${botSlug}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ quantity: newQuantity })
        });
        const data = await response.json();
        if (!response.ok) {
          alert(data.detail || data.status);
          return;
        }
        alert(data.status || data.detail);
      } catch (error) {
        alert("Error updating order quantity: " + error);
      }
    }

    async function updateOrderQuantitiesUI() {
      try {
        const response = await fetch("http://localhost:8000/order_quantities");
        if (!response.ok) {
          throw new Error("Failed to fetch order quantities");
        }
        const data = await response.json();
        // For each selected market, update the UI element with the latest order quantity
        selectedMarkets.forEach(market => {
          const botSlug = market.market_slug;
          const updatedQty = data[botSlug];
          const qtyElem = document.getElementById(`current-qty-${botSlug}`);
          if (qtyElem) {
            qtyElem.textContent = updatedQty !== undefined ? updatedQty : "N/A";
          }
        });
      } catch (err) {
        console.error("Error updating order quantities UI:", err);
      }
    }

    // Poll the endpoint every second (adjust the interval as needed)
    setInterval(updateOrderQuantitiesUI, 1000);

    /* ============================
       Periodically Check Tasks
       ============================ */
      async function checkTasks() {
        try {
          const resp = await fetch("http://localhost:8000/tasks");
          if (!resp.ok) throw new Error("Failed to fetch tasks");
          const data = await resp.json();
          const tasks = data.tasks; // Each object: { market_slug, status }

          // Update Active Bots count as before.
          const activeMarketSlugs = new Set(tasks.map(task => task.market_slug));
          const activeCount = activeMarketSlugs.size;
          const tasksOutput = document.getElementById("tasks-output");
          tasksOutput.textContent = activeCount > 0 ? `Active Bots: ${activeCount}` : "None";

          // For each selected market, adjust button states based on task status.
          selectedMarkets.forEach(market => {
            const botSlug = market.market_slug;
            // Find the task for this market.
            const taskObj = tasks.find(t => t.market_slug === botSlug);
            let status = taskObj ? taskObj.status : "Not Running";

            // Get button elements by their IDs:
            const btnGlobalStart = document.getElementById(`start-${botSlug}`);
            const btnGlobalStop  = document.getElementById(`stop-${botSlug}`);
            const btnStartYes    = document.getElementById(`start-side-0-${botSlug}`);
            const btnStartNo     = document.getElementById(`start-side-1-${botSlug}`);
            const btnStopYes     = document.getElementById(`stop-side-0-${botSlug}`);
            const btnStopNo      = document.getElementById(`stop-side-1-${botSlug}`);

            // Reset all buttons to enabled by default
            if(btnGlobalStart) btnGlobalStart.disabled = false;
            if(btnStartYes) btnStartYes.disabled = false;
            if(btnStartNo) btnStartNo.disabled = false;
            if(btnStopYes) btnStopYes.disabled = false;
            if(btnStopNo) btnStopNo.disabled = false;

            // Apply disabling rules based on status:
            if (status === "Running (Both)") {
              // If both sides are running, disable the global start and both side start buttons.
              if(btnGlobalStart) btnGlobalStart.disabled = true;
              if(btnStartYes) btnStartYes.disabled = true;
              if(btnStartNo) btnStartNo.disabled = true;
            }
            else if (status === "Not Running") {
              // If both sides are running, disable the global start and both side start buttons.
              if(btnStopNo) btnStopNo.disabled = true;
              if(btnStopYes) btnStopYes.disabled = true;
              if(btnGlobalStop) btnGlobalStop.disabled = true;
            }
            else if (status.startsWith("Running (")) {
              // Expecting status like "Running (Yes)" or "Running (No)"
              const match = status.match(/Running \((.+)\)/);
              if (match) {
                const runningOutcome = match[1];
                if(btnGlobalStart) btnGlobalStart.disabled = true;
                if (runningOutcome === "Yes") {
                  // Market is running on Yes, so disable:
                  //   - Start Yes (because it's already running)
                  //   - Stop No (because No side isn't running)
                  if(btnStartYes) btnStartYes.disabled = true;
                  if(btnStopNo) btnStopNo.disabled = true;
                } else if (runningOutcome === "No") {
                  // Market is running on No, so disable:
                  //   - Start No (because it's already running)
                  //   - Stop Yes (because Yes side isn't running)
                  if(btnStartNo) btnStartNo.disabled = true;
                  if(btnStopYes) btnStopYes.disabled = true;
                }
              }
            }
            // Optionally update the status element's text:
            const statusElem = document.getElementById(`status-${botSlug}`);
            if(statusElem) {
              statusElem.textContent = status;
              statusElem.style.color = (status === "Not Running") ? "red" : "lime";
            }
          });
          updateClearInactiveButton();
        } catch (error) {
          console.error("Error fetching tasks:", error);
        }
      }
      setInterval(checkTasks, 2000);

    /* ============================
       Shutdown
       ============================ */
    async function shutdownServer() {
      try {
        const response = await fetch("http://localhost:8000/shutdown", { method: "POST" });
        const data = await response.json();
        alert(data.status || data.detail);
      } catch (error) {
        alert("Error: " + error);
      }
    }

    /* ============================
       Balance, API Usage
       ============================ */
    async function updateBalance() {
      try {
        const response = await fetch("http://localhost:8000/balance");
        const data = await response.json();
        document.getElementById("balance-display").textContent = data.balance;
      } catch (error) {
        console.error("Error fetching balance:", error);
      }
    }
    setInterval(updateBalance, 500);

    async function updateApiUsageIndicator() {
      try {
        const response = await fetch("http://localhost:8000/api_usage");
        if (!response.ok) {
          console.error("Failed to fetch API usage");
          return;
        }
        const data = await response.json();
        const usage = data.api_usage;
        const maxUsage = 80;
        const pct = Math.min((usage / maxUsage) * 100, 100);
        document.getElementById("api-usage-progress").style.width = pct + "%";
        document.getElementById("api-usage-text").textContent =
          `Usage: ${usage} calls / ${maxUsage} calls`;
      } catch (error) {
        console.error("Error fetching API usage:", error);
      }
    }
    setInterval(updateApiUsageIndicator, 500);

    /* ============================
       On page load
       ============================ */
    async function loadMarketList() {
      try {
        const response = await fetch("http://localhost:8000/markets");
        const data = await response.json();
        marketList = data.markets;
      } catch (error) {
        console.error("Error loading market list:", error);
      }
    }

    async function refreshSelectedMarketsTokens() {
      // If your backend includes .tokens in the "suggestions" or "markets" endpoints,
      // you can store them. If not, you may need a custom endpoint for detailed market info.
      // This example assumes you have them in your existing manager.markets object.
      // Just a placeholder: do whatever you need to ensure selectedMarkets[i].tokens
      // is populated with [ { outcome: "Yes", ...}, { outcome: "No", ... } ] 
    }

    async function restoreActiveBots() {
      try {
        const response = await fetch("http://localhost:8000/tasks");
        const data = await response.json();
        activeTasks = data.tasks;
      } catch (error) {
        console.error("Error restoring active bots:", error);
      }
    }
    setInterval(restoreActiveBots, 2000);

    window.onload = async () => {
      await loadMarketList();
      loadSelectedMarkets();

      // If you need to fetch the tokens for each selected market:
      await refreshSelectedMarketsTokens();

      updateBotGrid();
    };
  </script>
</body>
